<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sorcery of Color</title>
  <meta name="description" content="Where colours become magic. A cute colour laboratory for making palettes.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@500&family=Italiana&family=Libre+Baskerville:wght@400;700&family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem("soc.theme"))||"moonlit-orchid"}catch(e){}</script>
</head>
<body>

  <div class="sky" id="sky" aria-hidden="true"></div>

  <header class="top">
    <h1><span>Sorcery</span><span>of</span><span>Color</span></h1>
    <p class="motto">Where colours become magic.</p>
    <nav class="tabs" aria-label="Sections">
      <button class="tab" data-view="lab" type="button" style="--i:0;--a:2deg;--c:var(--s1);--t:var(--on1)">Laboratory</button>
      <button class="tab" data-view="harmony" type="button" style="--i:1;--a:12deg;--c:var(--s2);--t:var(--on2)">Harmony</button>
      <button class="tab" data-view="explorer" type="button" style="--i:2;--a:22deg;--c:var(--s3);--t:var(--on3)">Explorer</button>
      <button class="tab" data-view="mood" type="button" style="--i:3;--a:32deg;--c:var(--s4);--t:var(--on4)">Moodboard</button>
      <button class="tab" data-view="grimoire" type="button" style="--i:4;--a:42deg;--c:var(--s5);--t:var(--on5)">My Grimoire</button>
    </nav>
  </header>

  <main class="stage">

    <!-- LABORATORY -->
    <section class="view" id="view-lab">
      <h2 class="lab-title">Brew a palette</h2>
      <div class="palette" id="palette"></div>
      <div class="actions">
        <button class="cast" id="generate" type="button">Generate palette</button>
        <button class="ghost" id="copyAll" type="button">Copy all codes</button>
        <button class="ghost" id="saveBtn" type="button">Save to Grimoire</button>
      </div>
      <div class="pills spells">
        <button class="pill" id="surprise" type="button">Surprise me</button>
        <button class="pill" id="trickster" type="button">The Trickster</button>
        <button class="pill" id="alchemist" type="button">The Alchemist</button>
      </div>
      <p class="tip">Press the space bar to generate. Lock a colour to keep it.</p>
    </section>

    <!-- HARMONY -->
    <section class="view" id="view-harmony" hidden>
      <h2 class="lab-title">Colour Harmony</h2>
      <div class="split">
        <div class="wheel-box"><canvas id="wheel" width="600" height="600" aria-label="Colour wheel. Tap or drag to choose a base hue."></canvas></div>
        <div class="panel">
          <div class="pills" id="types"></div>
          <label class="ctl">Saturation <input type="range" id="sat" min="0" max="100"></label>
          <label class="ctl">Lightness <input type="range" id="lig" min="5" max="95"></label>
          <div class="chips" id="harmonyChips"></div>
          <p class="why" id="why"></p>
          <div><button class="cast" id="toLab" type="button">Send to Laboratory</button></div>
        </div>
      </div>
    </section>

    <!-- EXPLORER -->
    <section class="view" id="view-explorer" hidden>
      <h2 class="lab-title">Colour Explorer</h2>
      <div class="split">
        <div class="panel">
          <input type="color" id="picker" aria-label="Pick a colour">
          <input class="field" id="hexIn" maxlength="7" spellcheck="false" aria-label="Hex code">
          <div class="nums"><span>RGB</span>
            <input class="field" id="rIn" type="number" min="0" max="255" aria-label="Red">
            <input class="field" id="gIn" type="number" min="0" max="255" aria-label="Green">
            <input class="field" id="bIn" type="number" min="0" max="255" aria-label="Blue"></div>
          <div class="nums"><span>HSL</span>
            <input class="field" id="hIn" type="number" min="0" max="360" aria-label="Hue">
            <input class="field" id="sIn" type="number" min="0" max="100" aria-label="Saturation">
            <input class="field" id="lIn" type="number" min="0" max="100" aria-label="Lightness"></div>
          <div class="chips" id="baseChip"></div>
          <p class="why">Tap any swatch to copy its code.</p>
        </div>
        <div class="panel" id="variations"></div>
      </div>
    </section>

    <!-- MOODBOARD -->
    <section class="view" id="view-mood" hidden>
      <h2 class="lab-title">Moodboard</h2>
      <div class="pills" id="mGroups"></div>
      <div class="pills mitems" id="mItems"></div>
      <div class="gcard feature" id="mCard"></div>
    </section>

    <!-- MY GRIMOIRE -->
    <section class="view" id="view-grimoire" hidden>
      <h2 class="lab-title">My Grimoire</h2>
      <div class="pills" id="gFilters"></div>
      <div class="gbar"><button class="ghost" id="copyBook" type="button">Copy all as text</button></div>
      <div class="gridp" id="gList"></div>
    </section>

  </main>

  <footer class="foot">
    <p>Experiment freely. Create beautifully. Embrace a little chaos. ✦</p>
  </footer>

  <aside class="themes" id="themes">
    <button class="themes-tab" id="themesTab" type="button" aria-expanded="false" aria-controls="themesPanel" aria-label="Change theme">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0L14.6 9.4 24 12 14.6 14.6 12 24 9.4 14.6 0 12 9.4 9.4Z"/></svg>
    </button>
    <div class="themes-panel" id="themesPanel"></div>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
