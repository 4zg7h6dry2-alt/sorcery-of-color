<<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sorcery of Color</title>
  <meta name="description" content="Where colours become magic. A cute colour laboratory for making palettes.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="sky" id="sky" aria-hidden="true"></div>

  <header class="top">
    <h1>Sorcery of Color</h1>
    <p class="motto">Where colours become magic.</p>
  </header>

  <main class="lab">
    <h2 class="lab-title">The Laboratory</h2>

    <div class="palette" id="palette"></div>

    <div class="actions">
      <button class="cast" id="generate">Generate palette</button>
      <button class="ghost" id="copyAll">Copy all codes</button>
    </div>
    <p class="tip">Press the space bar to generate. Lock a colour to keep it.</p>
  </main>

  <footer class="foot">
    <p>Experiment freely. Create beautifully ✦</p>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
